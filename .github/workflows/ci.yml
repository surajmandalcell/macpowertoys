name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: brew install rclone
      - name: Validate marketplace catalog schema and fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          "$RUNNER_TEMP/schema-venv/bin/pip" install --quiet jsonschema
          "$RUNNER_TEMP/schema-venv/bin/python" scripts/validate-marketplace-fixtures.py
      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project powertoys.xcodeproj \
            -scheme powertoys \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/macpowertoys-derived" \
            -resultBundlePath "$RUNNER_TEMP/MacPowerToysTests.xcresult" \
            -enableCodeCoverage YES \
            -only-testing:powertoysTests \
            -skip-testing:powertoysUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Enforce business-logic coverage floor
        env:
          COVERAGE_FLOOR: "25"
        run: |
          coverage="$(xcrun xccov view --report --json "$RUNNER_TEMP/MacPowerToysTests.xcresult" | jq -r '
            [
              .targets[]
              | select(.name | endswith(".app"))
              | .files[]
              | select(.path | test("/powertoys/(Core|Models|Services)/"))
            ] as $files
            | (($files | map(.coveredLines) | add) * 100 / ($files | map(.executableLines) | add))
          ')"
          printf 'Business-logic line coverage: %.2f%% (floor: %s%%)\n' "$coverage" "$COVERAGE_FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v actual="$coverage" -v floor="$COVERAGE_FLOOR" 'BEGIN { exit(actual + 0 < floor + 0) }'

  raycast:
    name: Raycast lint and build
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ui-smoke:
    name: macOS UI smoke tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated UI smoke tests
        run: |
          xcodebuild test \
            -project powertoys.xcodeproj \
            -scheme powertoys \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/macpowertoys-ui-derived" \
            -only-testing:powertoysUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS= \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PROVISIONING_PROFILE=
