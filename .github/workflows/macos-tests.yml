name: macOS unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos-tests.yml
      - Makefile
      - powertoys/**
      - powertoysTests/**
      - powertoys.xcodeproj/**

jobs:
  unit-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone for Cloud Sync integration tests
        run: brew install rclone
      - name: Run unit tests in the hosted Mac
        run: TEST_SESSION=isolated ADHOC=1 make test DERIVED_DATA="$RUNNER_TEMP/macpowertoys-derived"
      - name: Exercise Switch and Portman in the hosted Mac
        run: |
          xcodebuild -project powertoys.xcodeproj -scheme powertoys-desktop-tests \
            -derivedDataPath "$RUNNER_TEMP/macpowertoys-ui-derived" \
            -resultBundlePath "$RUNNER_TEMP/app-ui.xcresult" \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -only-testing:powertoysUITests/SwitchUITests \
            -only-testing:powertoysUITests/PortmanUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/powertoys/Local.entitlements" \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/powertoys/Local.entitlements" \
            MPT_SOURCE_COMMIT="$GITHUB_SHA" test
      - name: Build installable app archive
        run: |
          ADHOC=1 make build DERIVED_DATA="$RUNNER_TEMP/macpowertoys-derived"
          app="$RUNNER_TEMP/macpowertoys-derived/Build/Products/Release/MacPowerToys.app"
          test "$(plutil -extract MPTSourceCommit raw "$app/Contents/Info.plist")" = "$GITHUB_SHA"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/MacPowerToys.app.zip"
      - name: Save app archive
        uses: actions/upload-artifact@v4
        with:
          name: macpowertoys-app
          path: ${{ runner.temp }}/MacPowerToys.app.zip
          if-no-files-found: error
          retention-days: 3
      - name: Export test summary
        if: always()
        run: |
          result=$(find "$RUNNER_TEMP/macpowertoys-derived/Logs/Test" -maxdepth 1 -type d -name '*.xcresult' -print -quit 2>/dev/null || true)
          if [ -n "$result" ]; then
            xcrun xcresulttool get test-results summary --path "$result" > "$RUNNER_TEMP/macos-test-summary.json"
            jq -r '.testFailures[]? | "::error title=macOS test failure::\(.testName): \((.failureText // "Unknown failure") | gsub("\\r|\\n"; " "))"' "$RUNNER_TEMP/macos-test-summary.json"
          fi
      - name: Save test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-summary
          path: ${{ runner.temp }}/macos-test-summary.json
          if-no-files-found: warn
      - name: Export tray renders
        if: always()
        run: |
          result=$(find "$RUNNER_TEMP/macpowertoys-derived/Logs/Test" -maxdepth 1 -type d -name '*.xcresult' -print -quit 2>/dev/null || true)
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/tray-renders" --filter '*.png'
          fi
      - name: Save tray renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-renders
          path: ${{ runner.temp }}/tray-renders
          if-no-files-found: warn
      - name: Export app UI screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/app-ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/app-ui.xcresult" --output-path "$RUNNER_TEMP/app-ui-renders" --filter '*.png'
          fi
      - name: Save app UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ui-renders
          path: ${{ runner.temp }}/app-ui-renders
          if-no-files-found: warn
